name: Daily Fortune

on:
  workflow_dispatch:
  schedule:
    - cron: "10 7 * * *"
      timezone: "Asia/Tokyo"

permissions:
  contents: write

jobs:
  show-fortune:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with: 
          python-version: "3.13"

      - name: Run fortune
        run: docker run --rm sena2525/daily-fortune:1.0 > fortune.txt

      - name: Update README
        run: python scripts/update_fortune.py

      - name: Show changes
        run: git diff -- README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "変更がないため、コミットを省略します。"
            exit 0
          fi

          git commit -m "docs: update daily fortune"
          git push
